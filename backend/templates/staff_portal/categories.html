{% extends "staff_portal/base.html" %}{% block content %}<h1>Categories</h1><p><a href="{% url 'admin:catalog_category_add' %}">Add category in Django Admin</a></p><table><tr><th>Name</th><th>Parent</th><th>Active</th></tr>{% for item in items %}<tr><td><a href="{% url 'admin:catalog_category_change' item.pk %}">{{ item.name }}</a></td><td>{{ item.parent|default:"—" }}</td><td>{{ item.is_active|yesno:"Yes,No" }}</td></tr>{% empty %}<tr><td colspan="3">No categories.</td></tr>{% endfor %}</table>{% endblock %}

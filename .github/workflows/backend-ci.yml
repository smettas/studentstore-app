name: Backend smoke checks

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-do-not-use-in-production
      DJANGO_DEBUG: "True"
      STUDENTSTORE_MEDIA_PROVIDER: local
      POSTGRES_DB: studentstore_ci
      POSTGRES_USER: studentstore_ci
      POSTGRES_PASSWORD: ci-local-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Test storage configuration without a database
        working-directory: backend
        run: python manage.py test core.storage.tests
      - name: Read-only API and security regression tests
        working-directory: backend
        run: python manage.py test core.readiness.tests
      - name: Audit tracked files for obvious secrets
        run: python backend/scripts/security_audit.py
